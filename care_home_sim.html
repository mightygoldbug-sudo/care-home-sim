<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>介護施設経営シミュレーション 〜3年後の未来〜</title>
<style>
  :root{
    --navy: #1F3A3D;
    --sand: #EDE6D6;
    --sage: #7C9885;
    --clay: #C1694F;
    --ink: #26302E;
    --amber: #D9A441;
    --paper: #F7F3EA;
    --line: #D8CFBC;
    --danger: #B5473A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  #app{
    width:100%;
    max-width:520px;
    background:var(--paper);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--navy);
    color:var(--sand);
    padding:18px 20px 14px;
  }
  header h1{
    font-size:17px;
    margin:0 0 2px;
    font-weight:700;
    letter-spacing:.02em;
  }
  header p{
    margin:0;
    font-size:12px;
    color:#B9C7C4;
  }
  #statusbar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  .stat{
    padding:10px 4px 8px;
    text-align:center;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat .label{
    font-size:10px;
    color:#7A8482;
    margin-bottom:3px;
  }
  .stat .val{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
  }
  .stat .val.warn{color:var(--danger);}
  #month-badge{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px 0;
  }
  #month-badge .m{
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    background:var(--sage);
    color:#fff;
    padding:4px 12px;
    border-radius:2px;
  }
  #month-badge .g{
    font-size:11px;
    color:#7A8482;
  }
  main{
    flex:1;
    padding:14px 20px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px;
  }
  #char-card{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
  }
  #char-svg{
    flex-shrink:0;
    width:60px;
    height:60px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--sage);
    background:#FBE3D0;
  }
  #char-svg img{width:100%;height:100%;object-fit:cover;display:block;}
  .speech{
    position:relative;
    flex:1;
    background:var(--sand);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 13px;
    font-size:12.5px;
    line-height:1.55;
    color:var(--ink);
  }
  .speech:before{
    content:"";
    position:absolute;
    left:-7px;
    top:18px;
    width:0;height:0;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    border-right:7px solid var(--sand);
  }
  .char-name{
    display:block;
    font-size:10px;
    font-weight:700;
    color:var(--sage);
    margin-bottom:2px;
  }
  .card h2{
    font-size:14px;
    margin:0 0 8px;
    color:var(--navy);
    font-weight:700;
  }
  .card .tag{
    display:inline-block;
    font-size:10px;
    color:var(--clay);
    border:1px solid var(--clay);
    border-radius:2px;
    padding:1px 6px;
    margin-bottom:8px;
  }
  .card p{
    font-size:13px;
    line-height:1.7;
    margin:0 0 4px;
    color:var(--ink);
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:10px;
  }
  .choice-btn{
    text-align:left;
    background:var(--sand);
    border:1px solid var(--line);
    border-radius:2px;
    padding:10px 12px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    line-height:1.5;
  }
  .choice-btn:active{background:var(--sage);color:#fff;}
  .choice-btn .cname{font-weight:700;display:block;margin-bottom:2px;}
  .choice-btn .ccost{font-size:11px;color:#7A8482;}
  .choice-btn:active .ccost{color:#eee;}
  #log{
    font-size:12px;
    color:#5A635F;
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 14px;
    max-height:110px;
    overflow-y:auto;
  }
  #log .entry{margin-bottom:5px;padding-bottom:5px;border-bottom:1px dashed var(--line);}
  #log .entry:last-child{border-bottom:none;margin-bottom:0;}
  .primary-btn{
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:2px;
    padding:14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .primary-btn:active{background:var(--sage);}
  #result{
    text-align:center;
    padding:8px 4px;
  }
  #result .grade{
    font-size:52px;
    font-weight:700;
    color:var(--clay);
    line-height:1;
    margin:6px 0;
  }
  #result .score{
    font-size:13px;
    color:#5A635F;
  }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>やすらぎの丘 経営シミュレーション</h1>
    <p>あなたはホーム長。36ヶ月間、施設を守り抜けるか。</p>
  </header>

  <div id="statusbar">
    <div class="stat"><div class="label">資金</div><div class="val" id="s-cash">-</div></div>
    <div class="stat"><div class="label">稼働率</div><div class="val" id="s-occ">-</div></div>
    <div class="stat"><div class="label">入居者満足</div><div class="val" id="s-res">-</div></div>
    <div class="stat"><div class="label">職員満足</div><div class="val" id="s-staff">-</div></div>
    <div class="stat"><div class="label">評判</div><div class="val" id="s-rep">-</div></div>
  </div>

  <div id="month-badge">
    <span class="m" id="m-label">1 / 36ヶ月目</span>
    <span class="g" id="m-goal">定員50床・単価20万円/月</span>
  </div>

  <main>
    <div class="card" id="char-card">
      <div id="char-svg"></div>
      <div class="speech"><span class="char-name">相談員・カナさん</span><span id="char-line">よろしくお願いします。一緒に施設を支えていきましょう。</span></div>
    </div>

    <div class="card" id="scene-card">
      <span class="tag" id="scene-tag">今月の判断</span>
      <h2 id="scene-title">読み込み中...</h2>
      <p id="scene-text"></p>
      <div class="choices" id="scene-choices"></div>
    </div>

    <div id="log"></div>

    <div id="start-wrap">
      <button class="primary-btn" id="start-btn">経営をはじめる</button>
    </div>

    <div id="result-wrap" class="hidden">
      <div class="card">
        <div id="result">
          <div class="score" id="result-sub">3年間の経営、お疲れさまでした。</div>
          <div class="grade" id="result-grade">-</div>
          <p id="result-text"></p>
        </div>
        <button class="primary-btn" id="retry-btn">もう一度経営する</button>
      </div>
    </div>
  </main>
</div>

<script>
(function(){

  const CAPACITY = 50;
  const UNIT_PRICE = 200000; // 円/月・1床あたり
  const BASE_MONTHLY_COST = 6800000; // 人件費・食費・光熱費等の固定費ベース

  let state, monthPhase, eventPool, log;

  function initState(){
    state = {
      month: 0,
      cash: 5000000,
      occ: 68,      // 稼働率 %
      resident: 62, // 入居者満足度
      staff: 58,    // 職員満足度
      rep: 50,      // 評判
      lowCashStreak: 0
    };
    log = [];
    eventPool = shuffle(EVENTS.slice());
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function fmtYen(n){
    const sign = n<0 ? "-":"";
    n = Math.abs(Math.round(n));
    return sign + "¥" + n.toLocaleString("ja-JP");
  }

  const INVESTMENTS = [
    {
      name:"人材育成研修を実施",
      cost:300000,
      desc:"BPSDケアやヒヤリハット分析の研修を行い、職員の対応力を底上げする。",
      effect:{staff:8, resident:4, rep:1}
    },
    {
      name:"設備・環境を更新",
      cost:500000,
      desc:"居室や共有スペースの環境を改善し、入居者の暮らしやすさを高める。",
      effect:{resident:7, rep:3, staff:1}
    },
    {
      name:"ITツールを導入する",
      cost:200000,
      desc:"記録・分析業務を効率化し、職員の負担とヒヤリハットの見落としを減らす。",
      effect:{staff:5, rep:2, resident:1}
    },
    {
      name:"広告・見学対応を強化",
      cost:150000,
      desc:"地域向けの情報発信や見学対応を強化し、施設の認知度を高める。",
      effect:{rep:6}
    },
    {
      name:"今月はコストを抑えて様子を見る",
      cost:0,
      desc:"大きな投資はせず、現場の状況を見極める月にする。",
      effect:{staff:-2, resident:-1}
    }
  ];

  const EVENTS = [
    {
      tag:"ヒヤリハット",
      title:"転倒のヒヤリハットが発生",
      text:"夜勤帯で入居者が居室内で転倒しかけたとの報告が上がった。人的・設備・環境・管理の4要因で原因を洗い出す時間が必要になる。",
      choices:[
        {label:"4要因分析を丁寧に行い再発防止策を全職員で共有",cost:100000,desc:"時間はかかるが根本原因に対応できる",effect:{staff:4,resident:3,rep:2,cash:-100000}},
        {label:"当直者への注意喚起のみで済ませる",cost:0,desc:"その場は収まるが再発リスクが残る",effect:{staff:-2,resident:-2,rep:-1}}
      ]
    },
    {
      tag:"BPSD対応",
      title:"入居者の帰宅願望が強まっている",
      text:"認知症の入居者が『家に帰りたい』と繰り返し訴え、職員が対応に苦慮している。背景にある本人の心理的ニーズ（安心・愛着）を踏まえた対応が求められる。",
      choices:[
        {label:"パーソン・センタード・ケアに基づき個別対応を設計",cost:80000,desc:"職員の負担は増えるが本人の安心につながる",effect:{resident:6,staff:-2,rep:2,cash:-80000}},
        {label:"落ち着くまで見守りを強化するだけにする",cost:0,desc:"根本解決にはならないが手間は少ない",effect:{resident:1,staff:1}}
      ]
    },
    {
      tag:"職員",
      title:"ベテラン職員から退職の相談",
      text:"入職5年目の職員から『このままでは続けられない』と相談を受けた。負担感と将来への不安が理由のようだ。",
      choices:[
        {label:"面談を重ね、役割や働き方を見直す",cost:50000,desc:"時間をかけて信頼関係を再構築する",effect:{staff:7,cash:-50000}},
        {label:"引き止めず、円満退職をサポートする",cost:0,desc:"当面は人手不足の負担が増える",effect:{staff:-4,resident:-2}}
      ]
    },
    {
      tag:"行政",
      title:"実地指導（行政監査）の通知が届いた",
      text:"来月、市の実地指導が入ることになった。記録類の整備状況が問われる。",
      choices:[
        {label:"記録・書類を総点検し、体制を整える",cost:150000,desc:"評判の維持につながるが手間とコストがかかる",effect:{rep:5,staff:-2,cash:-150000}},
        {label:"通常業務を優先し、最低限の対応にとどめる",cost:0,desc:"指摘を受けるリスクが残る",effect:{rep:-4}}
      ]
    },
    {
      tag:"家族対応",
      title:"入居者家族からクレームが入った",
      text:"『対応が事務的で冷たい』という声が家族から寄せられた。感情的な訴えの背景には不安がある。",
      choices:[
        {label:"時間を取って丁寧にヒアリングし、説明する",cost:0,desc:"誠実な対応で信頼回復につなげる",effect:{rep:4,resident:2,staff:-1}},
        {label:"担当者からの簡単な謝罪連絡で済ませる",cost:0,desc:"その場はしのげるが不信感が残る可能性",effect:{rep:-2}}
      ]
    },
    {
      tag:"感染対策",
      title:"インフルエンザが施設内で発生",
      text:"入居者数名に発熱症状が見られ、感染対策の強化が必要になった。",
      choices:[
        {label:"ゾーニングと消毒体制を即座に強化する",cost:200000,desc:"感染拡大は防げるが費用がかかる",effect:{resident:3,rep:2,cash:-200000}},
        {label:"既存の対応マニュアル通りに静観する",cost:0,desc:"感染が広がるリスクがある",effect:{resident:-5,rep:-3}}
      ]
    },
    {
      tag:"採用",
      title:"介護福祉士からの応募があった",
      text:"経験豊富な介護福祉士から応募が来た。採用条件の交渉次第で入職の可否が変わる。",
      choices:[
        {label:"相場より高い条件を提示して確保する",cost:100000,desc:"人件費は増えるが戦力が強化される",effect:{staff:6,resident:2,cash:-100000}},
        {label:"既存の給与水準のまま採用を試みる",cost:0,desc:"辞退される可能性がある",effect:{staff:1}}
      ]
    },
    {
      tag:"ヒヤリハット",
      title:"誤薬のヒヤリハットが報告された",
      text:"配薬時にダブルチェックが漏れ、誤薬寸前で気づいたという報告が上がった。管理体制の見直しが必要かもしれない。",
      choices:[
        {label:"配薬フローを全面的に見直し、チェック体制を強化",cost:120000,desc:"再発防止につながるが現場の負担が一時的に増える",effect:{staff:2,resident:3,rep:2,cash:-120000}},
        {label:"当該職員への個別指導のみで対応",cost:0,desc:"根本的な仕組みの改善にはならない",effect:{staff:-1,resident:-1}}
      ]
    },
    {
      tag:"BPSD対応",
      title:"暴言・興奮が見られる入居者への対応",
      text:"ある入居者の言動が不安定になり、職員への暴言が増えている。氷山モデルで見えている行動の背景を探る必要がある。",
      choices:[
        {label:"多職種で背景要因（体調・環境・人的要因）を分析",cost:60000,desc:"根本対応につながるが時間がかかる",effect:{resident:5,staff:2,cash:-60000}},
        {label:"刺激を避けるため接触を最小限にする",cost:0,desc:"一時的にしのげるが孤立を招く恐れ",effect:{resident:-2,staff:1}}
      ]
    },
    {
      tag:"評判",
      title:"地域の口コミサイトに好意的なレビューが投稿された",
      text:"『職員の対応が丁寧で安心できる』という口コミが投稿された。追い風を活かせるかは対応次第。",
      choices:[
        {label:"見学希望者への対応体制を増強する",cost:80000,desc:"問い合わせ増加に備える",effect:{rep:5,cash:-80000}},
        {label:"特に何もせず自然な流れに任せる",cost:0,desc:"機会損失の可能性がある",effect:{rep:1}}
      ]
    },
    {
      tag:"職員",
      title:"職員間の人間関係トラブル",
      text:"シフトの偏りをめぐって職員同士の関係が悪化している。放置すると離職につながりかねない。",
      choices:[
        {label:"シフト体制を見直し、個別に話し合いの場を設ける",cost:40000,desc:"時間はかかるが職場環境が改善する",effect:{staff:6,cash:-40000}},
        {label:"当事者同士での解決に任せる",cost:0,desc:"関係がさらに悪化するリスクがある",effect:{staff:-5}}
      ]
    },
    {
      tag:"設備",
      title:"空調設備の不具合が発生",
      text:"共有スペースの空調が故障し、入居者から暑さ・寒さの訴えが出ている。",
      choices:[
        {label:"即座に修理・交換を手配する",cost:250000,desc:"入居者の快適性を守れる",effect:{resident:4,cash:-250000}},
        {label:"応急処置で当面をしのぐ",cost:50000,desc:"根本解決にはならない",effect:{resident:-1,cash:-50000}}
      ]
    },
    {
      tag:"BPSD対応",
      title:"物盗られ妄想への対応に苦慮",
      text:"入居者が『財布を盗られた』と職員や他の入居者を疑うようになった。関係性の悪化が懸念される。",
      choices:[
        {label:"MHLWの非薬物的介入指針に沿って環境調整を行う",cost:70000,desc:"専門的な対応で関係悪化を防ぐ",effect:{resident:5,rep:1,cash:-70000}},
        {label:"その都度、事実確認をして説明する",cost:0,desc:"一時的な対応にとどまる",effect:{resident:1,staff:-1}}
      ]
    },
    {
      tag:"経営",
      title:"介護報酬改定の情報が入ってきた",
      text:"来期の介護報酬改定により、加算要件が変わる見込みだという情報が入った。早めの準備が収益に影響する。",
      choices:[
        {label:"加算取得に向けて体制整備を先行して進める",cost:180000,desc:"将来の収益基盤を強化できる",effect:{rep:3,resident:2,cash:-180000}},
        {label:"改定内容が確定してから対応する",cost:0,desc:"対応が後手に回るリスクがある",effect:{}}
      ]
    },
    {
      tag:"家族対応",
      title:"看取りについて家族から相談を受けた",
      text:"終末期の対応方針について、家族から率直な相談があった。丁寧な意思決定支援が求められる。",
      choices:[
        {label:"多職種カンファレンスを開き、家族と方針を共有する",cost:50000,desc:"信頼関係が深まる",effect:{rep:4,resident:3,cash:-50000}},
        {label:"担当職員のみで簡潔に説明する",cost:0,desc:"家族の不安が残る可能性がある",effect:{rep:-1}}
      ]
    }
  ];

  const CHAR_LINES = {
    great: [
      "絶好調ですね！この経営、本当に素晴らしいです。",
      "施設全体が良い雰囲気に包まれています。",
      "資金にも余裕があって、理想的な状態です。"
    ],
    happy: [
      "いい流れですね、この調子で行きましょう。",
      "職員さんの表情も明るいみたいです。",
      "入居者さんも安心して過ごせていそうです。"
    ],
    normal: [
      "バランスを見ながら、無理のない判断をしていきましょう。",
      "小さな変化も見逃さないようにしたいですね。",
      "今のところ、大きな崩れはなさそうです。"
    ],
    worried: [
      "少し無理が出ているかもしれません…注意しましょう。",
      "資金繰り、そろそろ手を打った方がよさそうです。",
      "現場の負担が増えていないか、気にかけてください。"
    ]
  };

  function moodFromState(){
    if(state.cash < 0 || state.staff < 32 || state.resident < 32) return "worried";
    const avg = (state.resident + state.staff + state.rep) / 3;
    if(avg >= 82) return "great";
    if(avg >= 62) return "happy";
    return "normal";

  function charImgTag(mood){
    const src = CHAR_IMAGES[mood] || CHAR_IMAGES.normal;
    return '<img src="' + src + '" alt="相談員カナさん">';
  }

  function updateCharacter(){
    const mood = moodFromState();
    document.getElementById("char-svg").innerHTML = charImgTag(mood);
    const lines = CHAR_LINES[mood];
    document.getElementById("char-line").textContent = lines[Math.floor(Math.random()*lines.length)];
  }

  function updateStatusBar(){
    document.getElementById("s-cash").textContent = fmtYen(state.cash);
    document.getElementById("s-cash").className = "val" + (state.cash<0?" warn":"");
    document.getElementById("s-occ").textContent = Math.round(state.occ)+"%";
    document.getElementById("s-res").textContent = Math.round(state.resident);
    document.getElementById("s-staff").textContent = Math.round(state.staff);
    document.getElementById("s-rep").textContent = Math.round(state.rep);
    document.getElementById("m-label").textContent = state.month + " / 36ヶ月目";
  }

  function addLog(text){
    log.unshift(text);
    if(log.length>6) log.pop();
    document.getElementById("log").innerHTML = log.map(t=>'<div class="entry">'+t+'</div>').join("");
  }

  function applyEffect(effect){
    if(effect.cash) state.cash += effect.cash;
    if(effect.occ) state.occ = clamp(state.occ + effect.occ);
    if(effect.resident) state.resident = clamp(state.resident + effect.resident);
    if(effect.staff) state.staff = clamp(state.staff + effect.staff);
    if(effect.rep) state.rep = clamp(state.rep + effect.rep);
  }

  function runMonthlyFinance(){
    const occBeds = Math.round(CAPACITY * state.occ/100);
    const revenue = occBeds * UNIT_PRICE;
    let cost = BASE_MONTHLY_COST;
    if(state.staff < 40) cost += 400000; // 離職・採用コストの増加
    if(state.staff < 25) cost += 400000;
    const profit = revenue - cost;
    state.cash += profit;

    // 稼働率は評判・満足度に応じてゆっくり変動する
    const target = clamp(state.rep*0.5 + state.resident*0.5);
    state.occ = clamp(state.occ + (target - state.occ) * 0.15);

    // 職員満足度が低いと入居者満足度も引きずられる
    if(state.staff < 35) state.resident = clamp(state.resident - 2);

    if(state.cash < 0) state.lowCashStreak++; else state.lowCashStreak = 0;

    addLog("月次決算：売上"+fmtYen(revenue)+" / 経費"+fmtYen(cost)+" / 損益"+fmtYen(profit));
  }

  function startGame(){
    initState();
    document.getElementById("start-wrap").classList.add("hidden");
    document.getElementById("result-wrap").classList.add("hidden");
    nextMonth();
  }

  function nextMonth(){
    state.month++;
    updateStatusBar();

    if(state.cash < -3000000 || state.lowCashStreak >= 3){
      showResult(true);
      return;
    }
    if(state.month > 36){
      showResult(false);
      return;
    }

    monthPhase = "invest";
    renderInvestPhase();
  }

  function renderInvestPhase(){
    updateCharacter();
    document.getElementById("scene-tag").textContent = "今月の投資判断";
    document.getElementById("scene-title").textContent = state.month + "ヶ月目：どこにリソースを割きますか";
    document.getElementById("scene-text").textContent = "資金と現場の状況を踏まえ、今月の重点施策を1つ選んでください。";
    const wrap = document.getElementById("scene-choices");
    wrap.innerHTML = "";
    INVESTMENTS.forEach(inv=>{
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      const affordable = state.cash >= inv.cost;
      btn.innerHTML = '<span class="cname">'+inv.name+'</span>'+inv.desc+
        '<div class="ccost">コスト：'+(inv.cost>0?fmtYen(inv.cost):"なし")+(affordable?"":"（資金不足）")+'</div>';
      btn.disabled = !affordable;
      if(!affordable) btn.style.opacity = "0.45";
      btn.onclick = ()=>{
        applyEffect(Object.assign({cash:-inv.cost}, inv.effect));
        addLog("投資："+inv.name);
        monthPhase = "event";
        renderEventPhase();
      };
      wrap.appendChild(btn);
    });
  }

  function renderEventPhase(){
    if(eventPool.length===0) eventPool = shuffle(EVENTS.slice());
    const ev = eventPool.pop();
    updateCharacter();
    document.getElementById("scene-tag").textContent = ev.tag;
    document.getElementById("scene-title").textContent = ev.title;
    document.getElementById("scene-text").textContent = ev.text;
    const wrap = document.getElementById("scene-choices");
    wrap.innerHTML = "";
    ev.choices.forEach(ch=>{
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = '<span class="cname">'+ch.label+'</span>'+ch.desc+
        '<div class="ccost">コスト：'+(ch.cost>0?fmtYen(ch.cost):"なし")+'</div>';
      btn.onclick = ()=>{
        applyEffect(ch.effect || {});
        addLog(ev.title+"→「"+ch.label+"」を選択");
        updateStatusBar();
        runMonthlyFinance();
        updateStatusBar();
        nextMonth();
      };
      wrap.appendChild(btn);
    });
  }

  function showResult(bankrupt){
    document.getElementById("scene-card").classList.add("hidden");
    document.getElementById("log").classList.add("hidden");
    document.getElementById("result-wrap").classList.remove("hidden");

    const score = state.cash/50000 + state.rep*80 + state.resident*60 + state.staff*40 + state.occ*30;
    let grade, text;

    if(bankrupt){
      grade = "経営破綻";
      text = "資金が底をつき、施設の継続が困難になりました。稼働率と評判、そして職員満足度のバランスが経営の生命線です。";
    } else if(score >= 9000){
      grade = "S";
      text = "3年間、資金・入居者・職員のバランスを保ちながら施設を成長させました。地域から選ばれるホームになっています。";
    } else if(score >= 7000){
      grade = "A";
      text = "堅実な経営でした。大きな崩れなく3年を乗り切り、安定した基盤を築けています。";
    } else if(score >= 5000){
      grade = "B";
      text = "浮き沈みはありましたが、なんとか3年間施設を維持しました。次はどこに投資を厚くするか、ふり返ってみましょう。";
    } else {
      grade = "C";
      text = "経営はかなり厳しい状態で3年目を迎えました。資金繰りと現場のケアの質、両立の難しさを実感する結果になりました。";
    }

    let resultMood = "normal";
    if(bankrupt || grade==="C") resultMood = "worried";
    else if(grade==="S") resultMood = "great";
    else if(grade==="A") resultMood = "happy";
    document.getElementById("char-svg").innerHTML = charImgTag(resultMood);
    document.getElementById("char-line").textContent =
      bankrupt ? "力になれず申し訳ありません…次はきっと立て直せます。" :
      (resultMood==="great" ? "文句なしの結果です！本当に見事な3年間でした。" :
      resultMood==="happy" ? "3年間、本当にお疲れさまでした。素晴らしい経営でした。" :
      "3年間お疲れさまでした。次に活かせることがきっとありますね。");

    document.getElementById("result-grade").textContent = grade;
    document.getElementById("result-text").textContent = text +
      "（最終：資金"+fmtYen(state.cash)+" / 稼働率"+Math.round(state.occ)+"% / 評判"+Math.round(state.rep)+"）";
  }

  document.getElementById("start-btn").onclick = startGame;
  document.getElementById("retry-btn").onclick = ()=>{
    document.getElementById("scene-card").classList.remove("hidden");
    document.getElementById("log").classList.remove("hidden");
    document.getElementById("start-wrap").classList.remove("hidden");
    document.getElementById("result-wrap").classList.add("hidden");
    document.getElementById("scene-title").textContent = "準備完了";
    document.getElementById("scene-text").textContent = "「経営をはじめる」を押してスタートしてください。";
    document.getElementById("scene-choices").innerHTML = "";
    document.getElementById("scene-tag").textContent = "スタート待ち";
    document.getElementById("char-svg").innerHTML = charImgTag("normal");
    document.getElementById("char-line").textContent = "もう一度、一緒に施設を支えていきましょう。";
  };

  // 初期表示
  document.getElementById("char-svg").innerHTML = charImgTag("normal");
  document.getElementById("s-cash").textContent = fmtYen(5000000);
  document.getElementById("s-occ").textContent = "68%";
  document.getElementById("s-res").textContent = "62";
  document.getElementById("s-staff").textContent = "58";
  document.getElementById("s-rep").textContent = "50";

})();
</script>
</body>
</html>
